name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Cancel in-progress runs on the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── 1. Format check ─────────────────────────────────────────────────────────
  format:
    name: "Format — black + isort"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install format tools
        run: pip install black>=24.0 isort>=5.13

      - name: Check black formatting
        run: black --check --diff src/ tests/ run_context_inference.py

      - name: Check isort import ordering
        run: isort --check-only --diff src/ tests/ run_context_inference.py

  # ── 2. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: "Lint — flake8"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install lint tools
        run: pip install flake8>=7.0 flake8-bugbear flake8-docstrings

      - name: Run flake8
        run: flake8 src/ tests/ run_context_inference.py

  # ── 3. Type check ────────────────────────────────────────────────────────────
  typecheck:
    name: "Type check — pyright"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies + pyright
        run: |
          pip install python-dotenv>=1.0 requests>=2.31
          pip install pyright>=1.1

      - name: Run pyright (src only)
        run: pyright src/

  # ── 4. Test + Coverage ───────────────────────────────────────────────────────
  test:
    name: "Test — pytest + coverage"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install runtime + test dependencies
        run: |
          pip install python-dotenv>=1.0 requests>=2.31
          pip install pytest>=8.0 pytest-cov>=5.0

      - name: Create .env for tests (safe defaults — no real keys needed)
        run: |
          cat > .env << 'EOF'
          CONTEXT_INPUT_DIR=./transcripts
          CONTEXT_OUTPUT_DIR=./context_output
          CONTEXT_MODEL=qwen2.5:3b
          CONTEXT_MAX_WORKERS=2
          CONTEXT_MIN_WORDS=4
          CONTEXT_CHUNK_SIZE=50
          CONTEXT_TIMEOUT=120
          CONTEXT_TEMPERATURE=0.3
          OLLAMA_HOST=http://localhost:11434
          EOF

      - name: Run tests with coverage
        run: |
          python3 -m pytest tests/context_inference/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage to GitHub Actions summary
        if: always()
        run: |
          echo "## 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          python3 -m pytest tests/context_inference/ \
            --tb=no -q \
            --cov=src \
            --cov-report=term-missing \
            2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # ── 5. Validate .env.example ─────────────────────────────────────────────────
  validate-env-example:
    name: "Validate — .env.example completeness"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required keys are present in .env.example
        run: |
          REQUIRED_KEYS=(
            "CONTEXT_INPUT_DIR"
            "CONTEXT_OUTPUT_DIR"
            "CONTEXT_MODEL"
            "CONTEXT_MAX_WORKERS"
            "CONTEXT_MIN_WORDS"
            "CONTEXT_CHUNK_SIZE"
            "CONTEXT_TIMEOUT"
            "CONTEXT_TEMPERATURE"
            "OLLAMA_HOST"
          )
          MISSING=()
          for key in "${REQUIRED_KEYS[@]}"; do
            if ! grep -q "^${key}=" .env.example; then
              MISSING+=("$key")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ .env.example thiếu các key sau:"
            printf '  - %s\n' "${MISSING[@]}"
            exit 1
          else
            echo "✅ .env.example đầy đủ tất cả ${#REQUIRED_KEYS[@]} required keys."
          fi

  # ── 6. Validate scripts ──────────────────────────────────────────────────────
  validate-scripts:
    name: "Validate — shell scripts (shellcheck)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on all scripts
        run: shellcheck scripts/*.sh

  # ── 7. Security scan ─────────────────────────────────────────────────────────
  security:
    name: "Security — pip-audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit on core dependencies
        run: |
          pip install python-dotenv requests
          pip-audit --requirement <(pip freeze | grep -E "python-dotenv|requests")
        continue-on-error: true # advisory — does not fail CI

  # ── Gate: all checks must pass before merge ──────────────────────────────────
  all-checks:
    name: "✅ All checks passed"
    runs-on: ubuntu-latest
    needs:
      [format, lint, typecheck, test, validate-env-example, validate-scripts]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.format.result }}"            != "success" ]] ||
             [[ "${{ needs.lint.result }}"              != "success" ]] ||
             [[ "${{ needs.typecheck.result }}"         != "success" ]] ||
             [[ "${{ needs.test.result }}"              != "success" ]] ||
             [[ "${{ needs.validate-env-example.result }}" != "success" ]] ||
             [[ "${{ needs.validate-scripts.result }}"  != "success" ]]; then
            echo "❌ Một hoặc nhiều CI job thất bại."
            exit 1
          fi
          echo "🎉 Tất cả checks đã pass!"
