[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finetune-sherpa-vi"
version = "0.1.0"
description = "Fine-tuning Sherpa Vietnamese model"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
    "youtube-transcript-api>=0.6",
    "youtube_dl>=2021.12",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.0",
    "flake8-bugbear",
    "flake8-docstrings",
    "isort>=5.13",
    "pyright>=1.1",
    "black>=24.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Context-inference module dependencies (Ollama must be installed separately via download_model.sh)
context-inference = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

# ---------------------------------------------------------------------------
# Tool configurations
# ---------------------------------------------------------------------------

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["finetune_sherpa_vi"]
skip_glob = [".venv/*", "venv/*", "dist/*", "build/*"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
exclude = [
    ".venv",
    "venv",
    "dist",
    "build",
    "**/__pycache__",
]
reportMissingImports = true
reportMissingTypeStubs = false

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: real integration tests (no mock, may require local services)",
]
addopts = [
    "-v",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py", "*/tests/*"]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
